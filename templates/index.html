
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>🏏 IPL Score Predictor</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- jQuery and Select2 for searchable dropdowns -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <style>
        body {
            background: linear-gradient(135deg, #0d0d0d, #1a1a1a);
            color: #fff;
            font-family: 'Poppins', sans-serif;
            text-align: center;
            padding: 40px;
        }
/* 🌙 Base select box */
.select2-container--default .select2-selection--single {
    background: rgba(20, 20, 20, 0.6) !important;
    border: 1px solid rgba(255, 255, 255, 0.1) !important;
    backdrop-filter: blur(8px) !important;
    -webkit-backdrop-filter: blur(8px) !important;
    border-radius: 10px !important;
    height: 42px !important;
    color: #fff !important;
    display: flex;
    align-items: center;
    justify-content: center;  /* ✅ centers text horizontally */
    text-align: center !important; /* ✅ ensures centered text */
    transition: all 0.3s ease-in-out;
}

.select2-container--default .select2-selection--single:hover {
    background: rgba(40, 40, 40, 0.7) !important;
    border-color: rgba(255, 75, 43, 0.4) !important;
}

/* 🌈 Text inside select box */
.select2-container--default .select2-selection__rendered {
    color: #fff !important;
    text-align: center !important;  /* ✅ center inside rendered text */
    width: 100%;
    line-height: 40px !important;
    padding: 0 !important;
}

/* Dropdown arrow */
.select2-container--default .select2-selection__arrow {
    position: absolute;
    right: 8px;
    top: 50%;
    transform: translateY(-50%);
}

/* 🎞 Dropdown panel */
.select2-dropdown {
    background: rgba(10, 10, 10, 0.7) !important;
    backdrop-filter: blur(10px) !important;
    -webkit-backdrop-filter: blur(10px) !important;
    border: 1px solid rgba(255, 255, 255, 0.08) !important;
    border-radius: 10px !important;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
}

/* Centered options */
.select2-results__option {
    color: #fff !important;
    background: transparent !important;
    padding: 8px 12px !important;
    text-align: center !important;  /* ✅ center each option */
    transition: background 0.2s ease-in-out;
}

/* Highlight and selection colors */
.select2-results__option--highlighted {
    background: rgba(225, 29, 72, 0.8) !important;
    color: #fff !important;
    border-radius: 5px;
}

.select2-results__option[aria-selected=true] {
    background: rgba(255, 255, 255, 0.1) !important;
    color: #fff !important;
}

/* 🔍 Search input */
.select2-search--dropdown .select2-search__field {
    background: rgba(25, 25, 25, 0.6) !important;
    color: #fff !important;
    border: 1px solid rgba(255, 255, 255, 0.15) !important;
    border-radius: 6px !important;
    padding: 6px 10px !important;
    backdrop-filter: blur(6px) !important;
    text-align: center !important; /* ✅ centers typed text */
}

.select2-search--dropdown .select2-search__field::placeholder {
    color: #aaa !important;
}


</style>
</head>
<body>

    <h1 class="text-3xl font-bold mb-6 text-red-500">🏏 IPL Score Predictor</h1>

    <div class="container">
        <form method="POST" class="space-y-4">
            <div>
                <label class="block mb-1 text-gray-400">Venue</label>
                <select name="venue" class="select w-full">
                    {% for v in venues %}<option>{{ v }}</option>{% endfor %}
                </select>
            </div>

            <div>
                <label class="block mb-1 text-gray-400">Batting Team</label>
                <select name="bat_team" class="select w-full">
                    {% for t in bat_teams %}<option>{{ t }}</option>{% endfor %}
                </select>
            </div>

            <div>
                <label class="block mb-1 text-gray-400">Bowling Team</label>
                <select name="bowl_team" class="select w-full">
                    {% for t in bowl_teams %}<option>{{ t }}</option>{% endfor %}
                </select>
            </div>

            <div>
                <label class="block mb-1 text-gray-400">Batsman</label>
                <select name="batsman" class="select w-full">
                    {% for b in batsmen %}<option>{{ b }}</option>{% endfor %}
                </select>
            </div>

            <div>
                <label class="block mb-1 text-gray-400">Bowler</label>
                <select name="bowler" class="select w-full">
                    {% for b in bowlers %}<option>{{ b }}</option>{% endfor %}
                </select>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block mb-1 text-gray-400">Runs</label>
                    <input type="number" name="runs" class="w-full p-2 rounded bg-gray-800 border-none" required>
                </div>
                <div>
                    <label class="block mb-1 text-gray-400">Wickets</label>
                    <input type="number" name="wickets" class="w-full p-2 rounded bg-gray-800 border-none" required>
                </div>
                <div>
                    <label class="block mb-1 text-gray-400">Overs</label>
                    <input type="number" step="0.1" name="overs" class="w-full p-2 rounded bg-gray-800 border-none" required>
                </div>
                <div>
                    <label class="block mb-1 text-gray-400">Striker (0 or 1)</label>
                    <input type="number" name="striker" class="w-full p-2 rounded bg-gray-800 border-none" required>
                </div>
            </div>

            <button type="submit" class="w-full bg-red-500 hover:bg-red-600 p-2 rounded font-semibold mt-3">Predict Score</button>
        </form>

        {% if prediction %}
        <div class="mt-6 text-xl font-semibold text-green-400">
            🎯 Predicted Final Score: <span class="text-white">{{ prediction }}</span> Runs
        </div>
        {% endif %}
    </div>

    <script>
        $(document).ready(function() {
            $('.select').select2();
        });
    </script>
</body>
</html>
